# CI/CD Pipeline for TixPeer
#
# This workflow runs on every pull request and push to main.
# It ensures all tests pass before code can be merged.
#
# Test Suites:
# - Backend unit tests (120 tests)
# - Backend integration tests (98 tests)
# - Backend WebSocket tests (20 tests)
# - Frontend unit tests (21 tests)
# - E2E tests with Playwright (45 tests)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # Backend Unit Tests - Fast, no database needed
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        working-directory: backend

  # Backend Integration Tests - Requires PostgreSQL
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tixpeer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        working-directory: backend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: tixpeer_test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRATION: 7d

  # Backend WebSocket Tests - Requires PostgreSQL
  backend-websocket-tests:
    name: Backend WebSocket Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tixpeer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run WebSocket tests
        run: npm run test:websocket
        working-directory: backend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: tixpeer_test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRATION: 7d

  # Frontend Unit Tests
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

  # E2E Tests with Playwright - Full stack
  # Note: Playwright config automatically starts dev servers
  e2e-tests:
    name: E2E Tests (Playwright)
    # Pinned: Playwright 1.57 does not support Ubuntu 26.04, which ubuntu-latest moved to on 2026-10-19.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tixpeer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Create .env file for CI
        run: |
          cat > .env << 'EOF'
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_USER=test_user
          DATABASE_PASSWORD=test_password
          DATABASE_NAME=tixpeer_test
          JWT_SECRET=test-jwt-secret-for-ci
          JWT_EXPIRATION=7d
          BACKEND_PORT=3001
          CORS_ORIGIN=http://localhost:3000
          NEXT_PUBLIC_API_URL=http://localhost:3001
          RUN_SEED=true
          EOF

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Start backend and seed database
        run: |
          # Start the backend in background with seeding enabled
          cd backend && RUN_SEED=true node dist/main.js &
          # Wait for backend to be ready
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3001/api/docs > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: tixpeer_test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRATION: 7d

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: true
          # Tell Playwright not to start its own server since we already have one running
          PLAYWRIGHT_SKIP_WEBSERVER: false

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Type checking for both frontend and backend
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check frontend
        run: npm run type-check
        working-directory: frontend

      - name: Type check backend (build)
        run: npm run build
        working-directory: backend

  # Linting
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
